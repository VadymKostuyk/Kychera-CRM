  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- НАЛАШТУВАННЯ FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBKDRl-dDw9es9ICl-2ULHaZymiJHgGYHQ",
      authDomain: "kychera-pms.firebaseapp.com",
      databaseURL: "https://kychera-pms-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kychera-pms",
      storageBucket: "kychera-pms.firebasestorage.app",
      messagingSenderId: "402043280614",
      appId: "1:402043280614:web:b43927cf99205d459cef27"
    };

    let app, auth, db;
    let useFallback = false;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Помилка ініціалізації Firebase. Перемикаємось на локальний режим:", e);
      useFallback = true;
    }

    const appId = "kychera-mobile-premium-v3";

    window.firebaseServices = { 
      auth, 
      db, 
      appId, 
      signInAnonymously, 
      onAuthStateChanged, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot,
      useFallback
    };
  </script>

  <!-- React-додаток -->

    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // --- Кастомні іконки SVG ---

    const TrashIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const EditIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>;
    const SendIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>;
    const XIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>;
    const CheckIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>;
    const CopyIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>;
    const PlusCircleIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const ArrowDownCircleIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 13l-3 3m0 0l-3-3m3 3V8m0 13a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const ArrowUpCircleIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 11l3-3m0 0l3 3m-3-3v8m0 13a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const WalletIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>;
    const LogOutIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>;
    const LockIcon = () => <svg className="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>;
    const PhoneIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>;

    // Стандартні шаблони
    const defaultTemplates = [
      { id: 'CONFIRM', label: 'ПІДТВЕРДЖЕННЯ', text: 'Садиба Кичера 🌲\nВітаємо, {Гість}! Ваше пряме бронювання {Кімната} на період з {Заїзд} по {Виїзд} підтверджено. Сума: {Ціна} грн. Чекаємо на вас!' },
      { id: 'REMIND', label: 'НАГАДУВАННЯ', text: 'Садиба Кичера 🌲\nДобрий день, {Гість}! Нагадуємо про заїзд {Заїзд} у {Кімната}. Будемо раді зустрічі!' },
      { id: 'THANK_YOU', label: 'ПОДЯКА', text: 'Садиба Кичера 🌲\nДякуємо, {Гість}, що обрали нас для відпочинку! Гарної дороги додому.' },
      { id: 'PREPAYMENT', label: 'ПЕРЕДПЛАТА', text: 'Садиба Кичера 🌲\nШановний {Гість}! Для остаточного підтвердження {Кімната} ({Заїзд} - {Виїзд}), будь ласка, внесіть передплату у розмірі {Передплата} грн.' }
    ];

    const getNextDay = (dateStr) => {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    };

    function App() {
      const [user, setUser] = useState(null);
      
      // Ролі та авторизація
      const [userRole, setUserRole] = useState(() => localStorage.getItem('kychera_role') || ''); // 'admin' або 'guest'
      const [userName, setUserName] = useState(() => localStorage.getItem('kychera_user_name_global') || '');
      const [isNamePromptOpen, setIsNamePromptOpen] = useState(false);
      
      // Авторизаційна форма
      const [tempRole, setTempRole] = useState('guest');
      const [tempName, setTempName] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');

      // Пароль адміністратора
      const [adminPassword, setAdminPassword] = useState(() => localStorage.getItem('kychera_admin_password') || 'kichera2026');
      const [newAdminPasswordInput, setNewAdminPasswordInput] = useState('');

      // Стан даних
      const [bookings, setBookings] = useState([]);
      const [rooms, setRooms] = useState(['Котедж #1 (Головний)', 'Котедж #2 (Двоповерховий)', 'Апартаменти VIP']);
      const [customTemplates, setCustomTemplates] = useState(defaultTemplates);
      
      const [isLoading, setIsLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('connecting');
      const [isSaving, setIsSaving] = useState(false);

      // Локальний режим
      const [isOfflineMode, setIsOfflineMode] = useState(false);

      // Real-time сповіщення
      const [remoteChangeAlert, setRemoteChangeAlert] = useState(null);
      const prevBookingsRef = useRef(null);
      const isFirstLoadRef = useRef(true);
      const myUserIdRef = useRef(null);

      // Навігація
      const [activeTab, setActiveTab] = useState('availability'); 

      // Календар
      const [currentDate, setCurrentDate] = useState(() => {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), 1);
      });
      const [selectedRoom, setSelectedRoom] = useState('Котедж #1 (Головний)');
      
      // Стан дат календаря
      const [rangeStart, setRangeStart] = useState(null);
      const [rangeEnd, setRangeEnd] = useState(null);

      // Кастомний діалог підтвердження
      const [confirmDialog, setConfirmDialog] = useState({
        isOpen: false,
        title: '',
        message: '',
        onConfirm: null
      });

      // Форма створення / редагування
      const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
      const [editingBooking, setEditingBooking] = useState(null);
      const [formData, setFormData] = useState({
        guestName: '',
        guestPhone: '',
        roomName: 'Котедж #1 (Головний)',
        checkIn: '',
        checkOut: '',
        price: '',
        prepayment: '', 
        status: 'CONFIRMED',
        isFullyPaid: false, 
        notes: '',
        adults: 2,
        children: 0
      });

      // Шаблони повідомлень
      const [selectedDirectGuestId, setSelectedDirectGuestId] = useState('');
      const [selectedTemplateType, setSelectedTemplateType] = useState('CONFIRM');

      const [isEditingTemplates, setIsEditingTemplates] = useState(false);
      const [editingTemplateId, setEditingTemplateId] = useState(null);
      const [newTemplateLabel, setNewTemplateLabel] = useState('');
      const [newTemplateText, setNewTemplateText] = useState('');

      const [newRoomName, setNewRoomName] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [chatSearchTerm, setChatSearchTerm] = useState(''); 
      const [activeBanner, setActiveBanner] = useState(null);

      // Нові розширені фільтри для вкладки Бронювання
      const [filterRoom, setFilterRoom] = useState('ALL');
      const [filterPayment, setFilterPayment] = useState('ALL'); // 'ALL', 'PAID', 'UNPAID'

      // Стан підвкладок у вкладці "Ще"
      const [moreSubTab, setMoreSubTab] = useState('rooms'); // 'rooms', 'finance', 'settings'

      // Стан фільтрації для фінансового звіту
      const [reportMonth, setReportMonth] = useState(() => String(new Date().getMonth() + 1).padStart(2, '0'));
      const [reportYear, setReportYear] = useState(() => String(new Date().getFullYear()));

      // Стан обраної дати для перегляду заїздів/виїздів на Головній вкладці
      const [homeSelectedDate, setHomeSelectedDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      const showNotificationToast = (message) => {
        setActiveBanner(message);
        setTimeout(() => setActiveBanner(null), 3000);
      };

      const todayStr = useMemo(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }, []);

      useEffect(() => {
        if (!userRole || !userName) {
          setIsNamePromptOpen(true);
        }
      }, [userRole, userName]);

      useEffect(() => {
        const checkFirebaseReady = setInterval(() => {
          if (window.firebaseServices) {
            clearInterval(checkFirebaseReady);
            
            if (window.firebaseServices.useFallback) {
              enableLocalStorageFallback();
              return;
            }

            const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseServices;
            
            signInAnonymously(auth).then(() => {
              setSyncStatus('synced');
            }).catch(err => {
              console.error("Firebase auth error:", err);
              enableLocalStorageFallback();
            });

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) myUserIdRef.current = currentUser.uid;
            });

            return () => unsubscribe();
          }
        }, 100);

        return () => clearInterval(checkFirebaseReady);
      }, []);

      const enableLocalStorageFallback = () => {
        console.warn("Ввімкнено автономний режим PMS (Local Storage)");
        setIsOfflineMode(true);
        setSyncStatus('synced');
        setIsLoading(false);
        
        const localBookings = localStorage.getItem('kychera_fallback_bookings');
        if (localBookings) setBookings(JSON.parse(localBookings));
        
        const localRooms = localStorage.getItem('kychera_fallback_rooms');
        if (localRooms) setRooms(JSON.parse(localRooms));
        else localStorage.setItem('kychera_fallback_rooms', JSON.stringify(rooms));

        const localTemplates = localStorage.getItem('kychera_fallback_templates');
        if (localTemplates) {
          setCustomTemplates(JSON.parse(localTemplates));
        } else {
          setCustomTemplates(defaultTemplates);
          localStorage.setItem('kychera_fallback_templates', JSON.stringify(defaultTemplates));
        }
      };

      useEffect(() => {
        if (!user || isOfflineMode || !window.firebaseServices) return;

        const { db, appId, collection, doc, setDoc, onSnapshot } = window.firebaseServices;
        setIsLoading(true);

        const bookingsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
        const roomsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
        const templatesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'templates');

        const unsubscribeRooms = onSnapshot(roomsCollection, (snapshot) => {
          if (!snapshot.empty) {
            const loadedRooms = snapshot.docs.map(doc => doc.data().name);
            setRooms(loadedRooms);
            if (loadedRooms.length > 0 && !loadedRooms.includes(selectedRoom)) {
              setSelectedRoom(loadedRooms[0]);
            }
          } else {
            const defaultRoomsList = ['Котедж #1 (Головний)', 'Котедж #2 (Двоповерховий)', 'Апартаменти VIP'];
            defaultRoomsList.forEach(async (r) => {
              try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', r.replace(/\s+/g, '_')), { name: r });
              } catch (e) {
                console.error("Помилка ініціалізації кімнат:", e);
                enableLocalStorageFallback();
              }
            });
          }
        }, (error) => {
          console.warn("Помилка доступу до кімнат у Firestore:", error);
          enableLocalStorageFallback();
        });

        const unsubscribeTemplates = onSnapshot(templatesCollection, (snapshot) => {
          if (!snapshot.empty) {
            const loadedTemplates = snapshot.docs.map(doc => ({
              id: doc.id,
              ...doc.data()
            }));
            setCustomTemplates(loadedTemplates);
          } else {
            defaultTemplates.forEach(async (t) => {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'templates', t.id), {
                label: t.label,
                text: t.text
              });
            });
          }
        }, (error) => {
          console.warn("Помилка доступу до шаблонів у Firestore:", error);
        });

        const unsubscribeBookings = onSnapshot(bookingsCollection, (snapshot) => {
          const loadedBookings = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          if (!isFirstLoadRef.current && prevBookingsRef.current !== null) {
            snapshot.docChanges().forEach(change => {
              const data = { id: change.doc.id, ...change.doc.data() };
              if (data.updatedBy === userName && change.type !== 'added') return;
              const who = data.updatedBy || data.createdBy || 'Інший оператор';
              if (who && who !== userName) {
                let msg = '';
                if (change.type === 'added') msg = `➕ ${who} додав: ${data.guestName || 'нове бронювання'}`;
                else if (change.type === 'modified') msg = `✏️ ${who} змінив: ${data.guestName || 'бронювання'}`;
                else if (change.type === 'removed') msg = `🗑 ${who} видалив бронювання`;
                if (msg) setRemoteChangeAlert(msg);
              }
            });
          }

          isFirstLoadRef.current = false;

      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const adjustedFirstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        const days = [];
        for (let i = 0; i < adjustedFirstDayIndex; i++) {
          days.push({ empty: true });
        }

        for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
          const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          days.push({
            empty: false,
            dayNum,
            dateStr: dayStr,
            isPast: dayStr < todayStr 
          });
        }
        return days;
      };

      const isDateSelected = (dateStr) => {
        if (!rangeStart) return false;
        if (dateStr === rangeStart) return true;
        if (rangeEnd && dateStr === rangeEnd) return true;
        if (rangeEnd && dateStr > rangeStart && dateStr < rangeEnd) return true;
        return false;
      };

      const getDayStatusForRoom = (dateStr) => {
        const activeBookings = bookings.filter(b => 
          b.roomName === selectedRoom && 
          b.checkIn <= dateStr && 
          b.checkOut > dateStr

        if (activeBookings.some(b => b.status === 'MANUAL_CLOSE')) return 'MANUAL_CLOSE';
        if (activeBookings.some(b => b.status === 'CONFIRMED' || b.status === 'CHECKED_IN')) return 'DIRECT_BOOKING';
        return 'FREE';
      };

      const formatFriendlyDate = (dateStr) => {
        if (!dateStr) return 'Не обрано';
        const d = new Date(dateStr);
        const months = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} р.`;
      };

      // Розрахунок відсотка завантаженості котеджу на обраний місяць
      const currentMonthOccupancy = useMemo(() => {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        let occupiedCount = 0;
        for (let d = 1; d <= totalDays; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          if (getDayStatusForRoom(dateStr) !== 'FREE') {
            occupiedCount++;
          }
        }
        return Math.round((occupiedCount / totalDays) * 100);

      // --- КОРЕКТНЕ НАЛАШТУВАННЯ ТА ВИДАЛЕННЯ ТЕХНІЧНОГО ЗАКРИТТЯ ДАТ ---

      const handleToggleFullyPaid = async (bookingItem) => {

      // --- ІМПОРТ ТА ЕКСПОРТ (РЕЗЕРВНЕ КОПІЮВАННЯ) ---
      const handleExportData = () => {

          showNotificationToast("Резервну копію збережено!");

      const handleImportData = (event) => {
        const file = event.target.files[0];

        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (!imported.bookings || !Array.isArray(imported.bookings)) {
              showNotificationToast("Файл некоректний або пошкоджений!");
              return;
            }

            setConfirmDialog({
              isOpen: true,
              title: "Відновити дані з файлу?",
              message: `Буде відновлено ${imported.bookings.length} замовлень. Поточні дані у системі будуть перезаписані!`,
              onConfirm: async () => {
                if (isOfflineMode) {
                  setBookings(imported.bookings);
                  if (imported.rooms) setRooms(imported.rooms);
                  if (imported.customTemplates) setCustomTemplates(imported.customTemplates);
                  
                  localStorage.setItem('kychera_fallback_bookings', JSON.stringify(imported.bookings));

          status: b.status,

          notes: b.notes || '',
          adults: b.adults || 2,
          children: b.children || 0
        });

      // Фільтрація майбутніх бронювань
      const activeBookingsOnly = useMemo(() => {
        return bookings.filter(b => b.checkOut >= todayStr);
      }, [bookings, todayStr]);

      // Розширена фільтрація списку бронювань (додано фільтри за кімнатою та оплатою)
      const filteredBookings = useMemo(() => {
        return activeBookingsOnly.filter(b => {
          // Текстовий пошук
          const term = searchTerm.toLowerCase();
          const matchesSearch = (
            b.guestName?.toLowerCase().includes(term) ||
            (b.guestPhone && b.guestPhone.includes(term)) ||
            (b.checkIn && b.checkIn.includes(term)) ||
            b.roomName?.toLowerCase().includes(term)
          );

          // Фільтр за номером кімнати
          const matchesRoom = filterRoom === 'ALL' || b.roomName === filterRoom;

          // Фільтр за статусом оплати
          let matchesPayment = true;
          if (filterPayment === 'PAID') {
            matchesPayment = b.isFullyPaid === true;
          } else if (filterPayment === 'UNPAID') {
            matchesPayment = b.isFullyPaid !== true && b.status !== 'MANUAL_CLOSE';
          }

          return matchesSearch && matchesRoom && matchesPayment;
        }).sort((a, b) => new Date(a.checkIn) - new Date(b.checkIn));
      }, [activeBookingsOnly, searchTerm, filterRoom, filterPayment]);

      // Динамічний фінансовий звіт
      const stats = useMemo(() => {
        let revenue = 0;      
        let prepayment = 0;   
        let unpaid = 0;       

        bookings.forEach(b => {
          if (b.status !== 'CANCELLED' && b.status !== 'MANUAL_CLOSE') {
            const bPrice = parseFloat(b.price) || 0;
            const bPrepayment = parseFloat(b.prepayment) || 0;
            
            revenue += bPrice;
            
            if (b.isFullyPaid) {
              // Оплачено повністю
            } else {
              prepayment += bPrepayment;
              unpaid += Math.max(0, bPrice - bPrepayment);
            }
          }
        });
        return { totalCash: revenue, totalPrepayment: prepayment, outstanding: unpaid };
      }, [bookings]);

      // Точний звіт за конкретний обраний місяць
      const monthlyReportData = useMemo(() => {
        const targetYearMonth = `${reportYear}-${reportMonth}`; 
        
        const monthBookings = bookings.filter(b => {
          if (b.status === 'CANCELLED' || b.status === 'MANUAL_CLOSE') return false;
          if (!b.checkIn || !b.checkOut) return false;
          
          let current = new Date(b.checkIn);
          const end = new Date(b.checkOut);
          while (current < end) {
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            if (`${y}-${m}` === targetYearMonth) {
              return true;
            }
            current.setDate(current.getDate() + 1);
          }
          return false;
        });

        let totalProportionalIncome = 0;

        monthBookings.forEach(b => {
          const bPrice = parseFloat(b.price) || 0;
          const start = new Date(b.checkIn);
          const end = new Date(b.checkOut);
          const totalNights = Math.round((end - start) / (1000 * 60 * 60 * 24));

          if (totalNights <= 0) {
            const y = start.getFullYear();
            const m = String(start.getMonth() + 1).padStart(2, '0');
            if (`${y}-${m}` === targetYearMonth) {
              totalProportionalIncome += bPrice;
            }
            return;
          }

          const pricePerNight = bPrice / totalNights;
          let nightsInThisMonth = 0;

          let current = new Date(start);
          while (current < end) {
            const y = current.getFullYear();
            const m = String(current.getMonth() + 1).padStart(2, '0');
            if (`${y}-${m}` === targetYearMonth) {
              nightsInThisMonth++;
            }
            current.setDate(current.getDate() + 1);
          }

          totalProportionalIncome += pricePerNight * nightsInThisMonth;
        });

        return {
          bookingsCount: monthBookings.length,
          income: Math.round(totalProportionalIncome)
        };
      }, [bookings, reportMonth, reportYear]);

          if (b.status === 'CANCELLED' || b.status === 'MANUAL_CLOSE') return false;

          const name = (b.guestName || '').toLowerCase().trim();

          if (
            name === 'технічне закриття' ||
            name === 'зайнято' ||
            name.includes('closed') ||
            name.includes('not available') ||
            name.includes('ical') ||
            name.includes('block') ||
            name.includes('синхронізація') ||
            name.includes('sync')

            return false;
          }

          return true;

        return realFutureGuests.map(b => {
          const start = new Date(b.checkIn);
          const end = new Date(b.checkOut);
          
          const startDay = start.getDate();
          const startMonth = monthsGenitive[start.getMonth()];
          
          const endDay = end.getDate();
          const endMonth = monthsGenitive[end.getMonth()];
          const endYear = end.getFullYear();
          
          let dateStr = "";
          if (start.getMonth() === end.getMonth()) {
            dateStr = `З ${startDay} по ${endDay} ${startMonth} ${endYear}`;
          } else {
            dateStr = `З ${startDay} ${startMonth} по ${endDay} ${endMonth} ${endYear}`;

          const adults = b.adults || 2;
          const children = b.children || 0;
          const phone = b.guestPhone || 'без номера';
          const name = b.guestName || 'Гість';
          const room = b.roomName || 'Садиба Кичера';

                        <div key={rName} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center text-xs">
                          <span className="font-extrabold text-slate-800">{rName}</span>
                          <button onClick={() => handleDeleteRoom(rName)} className="text-rose-600 font-bold hover:text-rose-800">Видалити</button>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2">
                      <input type="text" placeholder="Назва котеджу..." value={newRoomName} onChange={(e) => setNewRoomName(e.target.value)} className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none" />
                      <button onClick={handleAddRoom} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-black">Додати</button>
                    </div>
                  </div>
                )}

                {/* ПІДВКЛАДКА: ФІНАНСИ */}
                {moreSubTab === 'finance' && (
                  <div className="space-y-4">
                    
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Стан каси</h3>
                      <div className="space-y-3">
                        <div className="flex justify-between items-center py-2 border-b border-slate-100">
                          <span className="text-xs text-slate-500 font-medium">Загальний дохід (Каса):</span>
                          <strong className="text-sm font-extrabold text-slate-900">{stats.totalCash.toLocaleString()} ₴</strong>
                        </div>
                        <div className="flex justify-between items-center py-2 border-b border-slate-100">
                          <span className="text-xs text-slate-500 font-medium">Утримано передплат:</span>
                          <strong className="text-sm font-extrabold text-indigo-700">{stats.totalPrepayment.toLocaleString()} ₴</strong>
                        </div>
                        <div className="flex justify-between items-center py-2">
                          <span className="text-xs text-slate-500 font-medium">Ще не доплатили гості:</span>
                          <strong className="text-sm font-extrabold text-rose-600">{stats.outstanding.toLocaleString()} ₴</strong>
                        </div>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <div className="flex justify-between items-center border-b pb-2">
                        <h3 className="text-xs font-black uppercase tracking-wider text-slate-900">Точний звіт за місяць</h3>
                        <div className="flex gap-1.5">
                          <select 
                            value={reportMonth} 
                            onChange={(e) => setReportMonth(e.target.value)}
                            className="bg-slate-100 border-0 text-[10px] font-bold rounded-md py-1 px-1.5 text-slate-700 focus:outline-none"
                          >
                            {['01','02','03','04','05','06','07','08','09','10','11','12'].map(m => (
                              <option key={m} value={m}>{m}</option>
                            ))}
                          </select>
                          <select 
                            value={reportYear} 
                            onChange={(e) => setReportYear(e.target.value)}
                            className="bg-slate-100 border-0 text-[10px] font-bold rounded-md py-1 px-1.5 text-slate-700 focus:outline-none"
                          >
                            {['2025','2026','2027','2028'].map(y => (
                              <option key={y} value={y}>{y}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-100 space-y-1">
                        <span className="text-[10px] font-bold text-emerald-700 uppercase block">Пропорційний дохід за місяць</span>
                        <div className="flex justify-between items-baseline">
                          <strong className="text-xl font-black text-emerald-800">+{monthlyReportData.income.toLocaleString()} ₴</strong>
                          <span className="text-xs text-emerald-600 font-bold">Бронювань: {monthlyReportData.bookingsCount}</span>
                        </div>
                        <p className="text-[9px] text-emerald-600 leading-relaxed pt-1 border-t border-emerald-200/50">
                          * Розраховується точно за кількістю ночей, що припадають саме на цей місяць. Наприклад, якщо заїзд 29 червня, а виїзд 5 липня, то в липень зараховується 4 ночі, а в червень — 2 ночі пропорційно до вартості.
                        </p>
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <div className="flex justify-between items-center border-b pb-2">
                        <div>
                          <h3 className="text-xs font-black uppercase tracking-wider text-slate-900">Копір для Нотаток</h3>
                          <p className="text-[9px] text-slate-400 mt-0.5">Всі бронювання від сьогоднішнього дня ({todayStr})</p>
                        </div>
                        <button 
                          onClick={() => {
                            const listText = getFormattedNotesList();
                            if (!listText.trim()) {
                              showNotificationToast("Немає майбутніх бронювань для копіювання");
                              return;
                            }
                            if (navigator.clipboard) {
                              navigator.clipboard.writeText(listText)
                                .then(() => showNotificationToast("Скопійовано для нотаток!"))
                                .catch(() => showNotificationToast("Помилка копіювання"));
                            } else {
                              const el = document.createElement('textarea');
                              el.value = listText;
                              document.body.appendChild(el);
                              el.select();
                              document.execCommand('copy');
                              document.body.removeChild(el);
                              showNotificationToast("Скопійовано!");
                            }
                          }}
                          className="bg-indigo-600 text-white font-extrabold text-[10px] px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition hover:bg-indigo-700"
                        >
                          <CopyIcon /> Копіювати все
                        </button>
                      </div>

                      <div className="bg-slate-50 border border-slate-200 rounded-xl p-3 max-h-48 overflow-y-auto">
                        <pre className="text-[10px] text-slate-600 font-mono whitespace-pre-wrap leading-relaxed">
                          {getFormattedNotesList() || "Майбутніх бронювань немає."}
                        </pre>
                      </div>
                    </div>

                  </div>
                )}

                {/* ПІДВКЛАДКА: НАЛАШТУВАННЯ */}
                {moreSubTab === 'settings' && (
                  <div className="space-y-4">
                    
                    {/* Керування паролем */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <h3 className="text-xs font-black uppercase tracking-wider text-slate-900">Безпека та пароль адміністратора</h3>
                      <p className="text-[10px] text-slate-400">Тут ви можете оновити пароль, який використовується для входу в адміністративну панель Садиби Кичера PMS.</p>
                      
                      <div className="space-y-3">
                        <div>
                          <label className="text-[9px] font-bold text-slate-400 uppercase block mb-1">Новий пароль адміністратора</label>
                          <input 
                            type="text" 
                            placeholder="Введіть новий пароль" 
                            value={newAdminPasswordInput} 
                            onChange={(e) => setNewAdminPasswordInput(e.target.value)} 
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none" 
                          />
                        </div>
                        <button 
                          onClick={handleChangeAdminPassword} 
                          className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold transition hover:bg-indigo-700"
                        >
                          Зберегти новий пароль
                        </button>
                      </div>
                    </div>

                    {/* РЕЗЕРВНЕ КОПІЮВАННЯ (ІМПОРТ/ЕКСПОРТ) */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4 border-dashed border-indigo-200">
                      <h3 className="text-xs font-black uppercase tracking-wider text-slate-900">💾 Резервне копіювання</h3>
                      <p className="text-[10px] text-slate-400">
                        Експортуйте замовлення у файл на пристрій для резервної копії або завантажуйте попередньо збережені дані.
                      </p>
                      
                      <div className="space-y-3">
                        <button 
                          onClick={handleExportData}
                          className="w-full bg-slate-900 hover:bg-black text-white py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition"
                        >
                          ⬇️ Експортувати у файл (.JSON)
                        </button>
                        
                        <div className="border-t border-slate-100 pt-3">
                          <label className="text-[9px] font-bold text-slate-400 uppercase block mb-1">Імпортувати / Відновити з файлу</label>
                          <input 
                            type="file" 
                            accept=".json" 
                            onChange={handleImportData}
                            className="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-[#4f46e5] hover:file:bg-indigo-100 cursor-pointer"
                          />
                        </div>
                      </div>
                    </div>

                  </div>
                )}

              </div>
            )}

          </main>

          {/* Модалка бронювання — ТІЛЬКИ ДЛЯ АДМІНІСТРАТОРА */}
          {isAddEditModalOpen && userRole === 'admin' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-xs font-bold uppercase text-slate-700">{editingBooking ? 'Редагувати' : 'Нове бронювання'}</h3>
                  <button onClick={() => setIsAddEditModalOpen(false)}><XIcon /></button>
                </div>
                <form onSubmit={handleSaveBooking} className="space-y-3">
                  <input type="text" placeholder="ПІБ гостя" required value={formData.guestName} onChange={(e) => setFormData(p => ({ ...p, guestName: e.target.value }))} className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold" />
                  <input type="tel" placeholder="Телефон" value={formData.guestPhone} onChange={(e) => setFormData(p => ({ ...p, guestPhone: e.target.value }))} className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] text-slate-400 font-bold block">Вартість (грн)</label>
                      <input type="number" required placeholder="0" value={formData.price} onChange={(e) => setFormData(p => ({ ...p, price: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs mt-1 font-bold" />
                    </div>
                    <div>
                      <label className="text-[9px] text-slate-400 font-bold block">Передплата (грн)</label>
                      <input type="number" placeholder="0" disabled={formData.isFullyPaid} value={formData.isFullyPaid ? '0' : formData.prepayment} onChange={(e) => setFormData(p => ({ ...p, prepayment: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs mt-1 disabled:opacity-50" />
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-slate-800 block">Оплачено повністю</span>
                      <span className="text-[9px] text-slate-400 block">Передплата автоматично стане 0</span>
                    </div>
                    <input 
                      type="checkbox"
                      checked={formData.isFullyPaid}
                      onChange={(e) => {
                        const isChecked = e.target.checked;
                        setFormData(prev => ({ 
                          ...prev, 
                          isFullyPaid: isChecked,
                          prepayment: isChecked ? '0' : prev.prepayment
                        }));
                      }}
                      className="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="text-[9px] text-slate-400 block mb-1">Кімната / Котедж</label>
                    <select value={formData.roomName} onChange={(e) => setFormData(prev => ({ ...prev, roomName: e.target.value }))} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold text-slate-700">
                      {rooms.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] text-slate-400 block mb-1">Дата заїзду</label>
                      <input type="date" required value={formData.checkIn} onChange={(e) => setFormData(p => ({ ...p, checkIn: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs" />
                    </div>
                    <div>
                      <label className="text-[9px] text-slate-400 block mb-1">Дата виїзду</label>
                      <input type="date" required value={formData.checkOut} onChange={(e) => setFormData(p => ({ ...p, checkOut: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs" />
                    </div>
                  </div>

                  <textarea placeholder="Примітки..." value={formData.notes} onChange={(e) => setFormData(p => ({ ...p, notes: e.target.value }))} rows="2" className="w-full p-3 bg-slate-50 border rounded-xl text-xs" />

                  <button type="submit" disabled={isSaving} className="w-full bg-[#4f46e5] text-white py-3.5 rounded-2xl text-xs font-black uppercase tracking-wider">{isSaving ? 'Збереження...' : 'ЗБЕРЕГТИ'}</button>
                </form>
              </div>
            </div>
          )}

          {/* Кастомне вікно підтвердження */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-xs w-full border border-slate-100 text-center space-y-4">
                <div className="space-y-1">
                  <h3 className="font-extrabold text-slate-900 text-base">{confirmDialog.title}</h3>
                  <p className="text-xs text-slate-500 leading-relaxed">{confirmDialog.message}</p>
                </div>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={() => setConfirmDialog(p => ({ ...p, isOpen: false }))} className="bg-slate-100 text-slate-700 text-xs py-2.5 rounded-xl font-bold">Скасувати</button>
                  <button onClick={() => { if (confirmDialog.onConfirm) confirmDialog.onConfirm(); setConfirmDialog(p => ({ ...p, isOpen: false })); }} className="bg-rose-600 text-white text-xs py-2.5 rounded-xl font-bold">Підтвердити</button>
                </div>
              </div>
            </div>
          )}

          {/* Модалка вибору ролі та імені оператора */}
          {isNamePromptOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-xs w-full border border-slate-100 space-y-4">
                <div className="text-center space-y-1">
                  <h3 className="font-black text-sm text-slate-900">Вхід у PMS Садиби</h3>
                  <p className="text-[11px] text-slate-400">Оберіть вашу роль для початку роботи.</p>
                </div>
                
                <div className="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                  <button 
                    type="button" 
                    onClick={() => { setTempRole('guest'); setAuthError(''); }}
                    className={`py-2 text-xs font-bold rounded-lg text-center transition ${tempRole === 'guest' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                  >
                    Гість
                  </button>
                  <button 
                    type="button" 
                    onClick={() => { setTempRole('admin'); setAuthError(''); }}
                    className={`py-2 text-xs font-bold rounded-lg text-center transition ${tempRole === 'admin' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                  >
                    Адміністратор
                  </button>
                </div>

                <div className="space-y-3 pt-2">
                  {tempRole === 'admin' ? (
                    <>
                      <div>
                        <label className="text-[10px] font-bold text-slate-400 uppercase block mb-1">Ім'я оператора</label>
                        <input 
                          type="text" 
                          placeholder="Приклад: Ірина" 
                          value={tempName} 
                          onChange={(e) => setTempName(e.target.value)} 
                          className="w-full px-3 py-2.5 border rounded-xl text-xs font-bold focus:outline-none" 
                        />
                      </div>
                      <div>
                        <div className="flex items-center justify-between mb-1">
                          <label className="text-[10px] font-bold text-slate-400 uppercase">Пароль</label>
                          <span className="text-[9px] text-[#4f46e5] font-semibold">дефолт: kichera2026</span>
                        </div>
                        <div className="relative">
                          <input 
                            type="password" 
                            placeholder="••••••" 
                            value={passwordInput} 
                            onChange={(e) => setPasswordInput(e.target.value)} 
                            className="w-full px-3 py-2 pl-8 border rounded-xl text-xs font-bold focus:outline-none" 
                            onKeyDown={(e) => e.key === 'Enter' && handleLoginSubmit()}
                          />
                          <span className="absolute inset-y-0 left-2.5 flex items-center pointer-events-none">
                            <LockIcon />
                          </span>
                        </div>
                      </div>
                    </>
                  ) : (
                    <div className="p-3 bg-slate-50 border rounded-xl text-[11px] text-slate-500 leading-relaxed text-center">
                      🟢 <strong>Вхід без пароля.</strong> Ви зможете переглядати календар завантаженості та вільні дати без права редагування.
                    </div>
                  )}

                  {authError && (
                    <p className="text-[11px] text-rose-500 text-center font-bold">{authError}</p>
                  )}
                  
                  <button 
                    onClick={handleLoginSubmit} 
                    className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold mt-2"
                  >
                    {tempRole === 'admin' ? 'Увійти як Адміністратор' : 'Увійти як Гість'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Нижня панель навігації */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-3 flex justify-around items-center z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'home' ? 'text-[#4f46e5]' : 'text-slate-400'}`}>
              <HomeIcon />
              <span>Головна</span>
            </button>
            
            <button onClick={() => setActiveTab('availability')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'availability' ? 'text-[#4f46e5]' : 'text-slate-400'}`}>
              <CalendarIcon />
              <span>Календар</span>
            </button>
            
            {userRole === 'admin' && (
              <>
                <button onClick={() => setActiveTab('bookings')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'bookings' ? 'text-[#4f46e5]' : 'text-slate-400'}`}>
                  <ClockIcon />
                  <span>Бронювання</span>
                </button>
                <button onClick={() => setActiveTab('messages')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'messages' ? 'text-[#4f46e5]' : 'text-slate-400'}`}>
                  <MessageSquareIcon />
                  <span>Чати</span>
                </button>
                <button onClick={() => setActiveTab('more')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'more' ? 'text-[#4f46e5]' : 'text-slate-400'}`}>
                  <SlidersIcon />
                  <span>Ще</span>
                </button>
              </>
            )}
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
