<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Садиба Кичера PMS</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Кичера PMS">
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/4f46e5/ffffff?text=КЕ&font=montserrat">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .bg-stripes {
      background-image: repeating-linear-gradient(
        45deg,
        #ffe4e6,
        #ffe4e6 4px,
        #ffffff 4px,
        #ffffff 8px
      );
    }
    button, select, input {
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .toast-animate { animation: slideDown 0.3s ease forwards; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulse-dot { animation: pulse-dot 1.5s infinite; }
  </style>

  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</head>
<body class="bg-[#fafbfc] text-slate-800">

  <div id="root"></div>

  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel для підтримки JSX в одному файлі -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- НАЛАШТУВАННЯ FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBKDRl-dDw9es9ICl-2ULHaZymiJHgGYHQ",
      authDomain: "kychera-pms.firebaseapp.com",
      databaseURL: "https://kychera-pms-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "kychera-pms",
      storageBucket: "kychera-pms.firebasestorage.app",
      messagingSenderId: "402043280614",
      appId: "1:402043280614:web:b43927cf99205d459cef27"
    };

    let app, auth, db;
    let useFallback = false;

    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
    } catch (e) {
      console.warn("Помилка ініціалізації Firebase. Перемикаємось на локальний режим:", e);
      useFallback = true;
    }

    const appId = "kychera-mobile-premium-v3";

    window.firebaseServices = { 
      auth, 
      db, 
      appId, 
      signInAnonymously, 
      onAuthStateChanged, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot,
      useFallback
    };
  </script>

  <!-- React-додаток -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Кастомні іконки SVG ---
    const HomeIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>;
    const CalendarIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>;
    const ClockIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0y" /></svg>;
    const MessageSquareIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>;
    const SlidersIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" /></svg>;
    const UserIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>;
    const SearchIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
    const ChevronLeftIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>;
    const ChevronRightIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" /></svg>;
    const TrashIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;
    const EditIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>;
    const SendIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>;
    const XIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>;
    const CheckIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>;
    const CopyIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" /></svg>;
    const PlusCircleIcon = () => <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const ArrowDownCircleIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M15 13l-3 3m0 0l-3-3m3 3V8m0 13a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const ArrowUpCircleIcon = () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M9 11l3-3m0 0l3 3m-3-3v8m0 13a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const WalletIcon = () => <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" strokeLinejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" /></svg>;

    function App() {
      const [user, setUser] = useState(null);
      const [userName, setUserName] = useState('');
      const [isNamePromptOpen, setIsNamePromptOpen] = useState(false);
      const [tempName, setTempName] = useState('');
      
      // Стан даних
      const [bookings, setBookings] = useState([]);
      const [rooms, setRooms] = useState(['Котедж #1 (Головний)', 'Котедж #2 (Двоповерховий)', 'Апартаменти VIP']);
      const [expenses, setExpenses] = useState([]);
      
      const [isLoading, setIsLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('connecting');
      const [isSaving, setIsSaving] = useState(false);

      // Локальний режим як резервний варіант
      const [isOfflineMode, setIsOfflineMode] = useState(false);

      // Real-time сповіщення від інших операторів
      const [remoteChangeAlert, setRemoteChangeAlert] = useState(null);
      const prevBookingsRef = useRef(null);
      const isFirstLoadRef = useRef(true);
      const myUserIdRef = useRef(null);

      // Навігація
      const [activeTab, setActiveTab] = useState('availability'); 

      // Календар
      const [currentDate, setCurrentDate] = useState(() => {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), 1);
      });
      const [selectedRoom, setSelectedRoom] = useState('Котедж #1 (Головний)');
      
      // Стан дат календаря
      const [rangeStart, setRangeStart] = useState(null);
      const [rangeEnd, setRangeEnd] = useState(null);

      // Кастомний діалог підтвердження для обходу обмежень iframe на iOS
      const [confirmDialog, setConfirmDialog] = useState({
        isOpen: false,
        title: '',
        message: '',
        onConfirm: null
      });

      // Стан форми створення / редагування
      const [isAddEditModalOpen, setIsAddEditModalOpen] = useState(false);
      const [editingBooking, setEditingBooking] = useState(null);
      const [formData, setFormData] = useState({
        guestName: '',
        guestPhone: '',
        roomName: 'Котедж #1 (Головний)',
        checkIn: '',
        checkOut: '',
        price: '',
        prepayment: '', 
        status: 'CONFIRMED',
        isFullyPaid: false, 
        notes: '',
        adults: 2,
        children: 0
      });

      // Шаблони повідомлень
      const [selectedDirectGuestId, setSelectedDirectGuestId] = useState('');
      const [selectedTemplateType, setSelectedTemplateType] = useState('CONFIRM');
      const [customTemplates, setCustomTemplates] = useState([
        { id: 'CONFIRM', label: 'ПІДТВЕРДЖЕННЯ', text: 'Садиба Кичера 🌲\nВітаємо, {Гість}! Ваше пряме бронювання {Кімната} на період з {Заїзд} по {Виїзд} підтверджено. Сума: {Ціна} грн. Чекаємо на вас!' },
        { id: 'REMIND', label: 'НАГАДУВАННЯ', text: 'Садиба Кичера 🌲\nДобрий день, {Гість}! Нагадуємо про заїзд {Заїзд} у {Кімната}. Будемо раді зустрічі!' },
        { id: 'THANK_YOU', label: 'ПОДЯКА', text: 'Садиба Кичера 🌲\nДякуємо, {Гість}, що обрали нас для відпочинку! Гарної дороги додому.' },
        { id: 'PREPAYMENT', label: 'ПЕРЕДПЛАТА', text: 'Садиба Кичера 🌲\nШановний {Гість}! Для остаточного підтвердження {Кімната} ({Заїзд} - {Виїзд}), будь ласка, внесіть передплату у розмірі {Передплата} грн.' }
      ]);

      const [isEditingTemplates, setIsEditingTemplates] = useState(false);
      const [newTemplateLabel, setNewTemplateLabel] = useState('');
      const [newTemplateText, setNewTemplateText] = useState('');

      const [newRoomName, setNewRoomName] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const [chatSearchTerm, setChatSearchTerm] = useState(''); // Новий стан для пошуку у чатах за іменем/датою заїзду
      const [activeBanner, setActiveBanner] = useState(null);

      // Стан підвкладок у вкладці "Ще"
      const [moreSubTab, setMoreSubTab] = useState('rooms'); // 'rooms', 'finance', 'expenses'

      // Форма витрат
      const [expenseDesc, setExpenseDesc] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expenseDate, setExpenseDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });

      // Стан фільтрації для фінансового звіту
      const [reportMonth, setReportMonth] = useState(() => String(new Date().getMonth() + 1).padStart(2, '0'));
      const [reportYear, setReportYear] = useState(() => String(new Date().getFullYear()));

      // --- Функція сповіщень (toast) ---
      const showNotificationToast = (message) => {
        setActiveBanner(message);
        setTimeout(() => setActiveBanner(null), 3000);
      };

      const todayStr = useMemo(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }, []);

      // Ініціалізація та відстеження Auth у Firebase з безпечним резервуванням
      useEffect(() => {
        const checkFirebaseReady = setInterval(() => {
          if (window.firebaseServices) {
            clearInterval(checkFirebaseReady);
            
            if (window.firebaseServices.useFallback) {
              enableLocalStorageFallback();
              return;
            }

            const { auth, signInAnonymously, onAuthStateChanged } = window.firebaseServices;
            
            signInAnonymously(auth).then(() => {
              setSyncStatus('synced');
            }).catch(err => {
              console.error("Firebase auth error:", err);
              enableLocalStorageFallback();
            });

            const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) myUserIdRef.current = currentUser.uid;
            });

            const savedName = localStorage.getItem('kychera_user_name_global');
            if (savedName) {
              setUserName(savedName);
              setIsNamePromptOpen(false);
            } else {
              setIsNamePromptOpen(true);
            }

            return () => unsubscribe();
          }
        }, 100);

        return () => clearInterval(checkFirebaseReady);
      }, []);

      // Увімкнення локального офлайн-режиму збереження
      const enableLocalStorageFallback = () => {
        console.warn("Ввімкнено автономний режим PMS (Local Storage)");
        setIsOfflineMode(true);
        setSyncStatus('synced');
        setIsLoading(false);
        
        // Завантаження локальних даних
        const localBookings = localStorage.getItem('kychera_fallback_bookings');
        if (localBookings) setBookings(JSON.parse(localBookings));
        
        const localRooms = localStorage.getItem('kychera_fallback_rooms');
        if (localRooms) setRooms(JSON.parse(localRooms));
        else localStorage.setItem('kychera_fallback_rooms', JSON.stringify(rooms));

        const localExpenses = localStorage.getItem('kychera_fallback_expenses');
        if (localExpenses) setExpenses(JSON.parse(localExpenses));

        const savedName = localStorage.getItem('kychera_user_name_global');
        if (savedName) {
          setUserName(savedName);
          setIsNamePromptOpen(false);
        } else {
          setIsNamePromptOpen(true);
        }
      };

      // Підключення до бази даних реального часу (Firestore)
      useEffect(() => {
        if (!user || isOfflineMode || !window.firebaseServices) return;

        const { db, appId, collection, doc, setDoc, onSnapshot } = window.firebaseServices;
        setIsLoading(true);

        const bookingsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
        const roomsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
        const expensesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');

        // Кімнати
        const unsubscribeRooms = onSnapshot(roomsCollection, (snapshot) => {
          if (!snapshot.empty) {
            const loadedRooms = snapshot.docs.map(doc => doc.data().name);
            setRooms(loadedRooms);
            if (loadedRooms.length > 0 && !loadedRooms.includes(selectedRoom)) {
              setSelectedRoom(loadedRooms[0]);
            }
          } else {
            const defaultRoomsList = ['Котедж #1 (Головний)', 'Котедж #2 (Двоповерховий)', 'Апартаменти VIP'];
            defaultRoomsList.forEach(async (r) => {
              try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rooms', r.replace(/\s+/g, '_')), { name: r });
              } catch (e) {
                console.error("Помилка ініціалізації кімнат:", e);
                enableLocalStorageFallback();
              }
            });
          }
        }, (error) => {
          console.warn("Помилка доступу до кімнат у Firestore:", error);
          enableLocalStorageFallback();
        });

        // Бронювання — з real-time сповіщеннями від інших операторів
        const unsubscribeBookings = onSnapshot(bookingsCollection, (snapshot) => {
          const loadedBookings = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

          if (!isFirstLoadRef.current && prevBookingsRef.current !== null) {
            snapshot.docChanges().forEach(change => {
              const data = { id: change.doc.id, ...change.doc.data() };
              if (data.updatedBy === userName && change.type !== 'added') return;
              const who = data.updatedBy || data.createdBy || 'Інший оператор';
              if (who && who !== userName) {
                let msg = '';
                if (change.type === 'added') msg = `➕ ${who} додав: ${data.guestName || 'нове бронювання'}`;
                else if (change.type === 'modified') msg = `✏️ ${who} змінив: ${data.guestName || 'бронювання'}`;
                else if (change.type === 'removed') msg = `🗑 ${who} видалив бронювання`;
                if (msg) setRemoteChangeAlert(msg);
              }
            });
          }

          isFirstLoadRef.current = false;
          prevBookingsRef.current = loadedBookings;
          setBookings(loadedBookings);
          setSyncStatus('synced');
          setIsLoading(false);
        }, (error) => {
          console.warn("Firestore Database не активний. Автоматичний перехід на автономний режим.");
          enableLocalStorageFallback();
        });

        // Витрати
        const unsubscribeExpenses = onSnapshot(expensesCollection, (snapshot) => {
          const loadedExpenses = snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));
          setExpenses(loadedExpenses);
        }, (error) => {
          console.warn("Помилка доступу до витрат у Firestore:", error);
        });

        return () => {
          unsubscribeRooms();
          unsubscribeBookings();
          unsubscribeExpenses();
        };
      }, [user, isOfflineMode]);

      const logActivity = async (actionText) => {
        if (isOfflineMode) return;
        if (!user || !window.firebaseServices) return;
        const { db, appId, collection, addDoc } = window.firebaseServices;
        try {
          const logsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'activity_logs');
          await addDoc(logsCollection, {
            operator: userName || 'Адміністратор',
            userId: user.uid,
            action: actionText,
            timestamp: Date.now()
          });
        } catch (e) {
          console.error(e);
        }
      };

      const handleSaveUserName = () => {
        if (!tempName.trim()) return;
        const finalName = tempName.trim();
        setUserName(finalName);
        localStorage.setItem('kychera_user_name_global', finalName);
        setIsNamePromptOpen(false);
        logActivity(`Оператор ${finalName} увійшов в систему Садиби.`);
      };

      const handleAddRoom = async () => {
        const rName = newRoomName.trim();
        if (!rName) return;

        if (isOfflineMode) {
          const updatedRooms = [...rooms, rName];
          setRooms(updatedRooms);
          localStorage.setItem('kychera_fallback_rooms', JSON.stringify(updatedRooms));
          setNewRoomName('');
          showNotificationToast(`Номер "${rName}" успішно додано локально!`);
          return;
        }

        if (!window.firebaseServices) return;
        const { db, appId, doc, setDoc } = window.firebaseServices;
        try {

        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        const adjustedFirstDayIndex = firstDayIndex === 0 ? 6 : firstDayIndex - 1;

        const days = [];
        for (let i = 0; i < adjustedFirstDayIndex; i++) {
          days.push({ empty: true });
        }

        for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
          const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          days.push({
            empty: false,
            dayNum,
            dateStr: dayStr,
            isPast: dayStr < todayStr 
          });
        }
        return days;
      };

      // Фільтрація майбутніх бронювань: автоматично пропадають броні, дати яких вже пройшли (checkOut < todayStr)
      const activeBookingsOnly = useMemo(() => {

      const filteredBookings = useMemo(() => {
        return activeBookingsOnly.filter(b => {
          const term = searchTerm.toLowerCase();
          return (
            b.guestName?.toLowerCase().includes(term) ||
            (b.guestPhone && b.guestPhone.includes(term)) ||
            (b.checkIn && b.checkIn.includes(term)) ||
            b.roomName?.toLowerCase().includes(term)
          );

      // Динамічний фінансовий звіт (досліджує всю базу бронювань для каси)
      const stats = useMemo(() => {
        let revenue = 0;      // Загальна каса (вартість усіх підтверджених броней)
        let prepayment = 0;   // Загальна сума внесених передплат по незавершених платежах
        let unpaid = 0;       // Скільки ще не доплатили (загальна вартість - передплата, де isFullyPaid === false)

        bookings.forEach(b => {
          if (b.status !== 'CANCELLED' && b.status !== 'MANUAL_CLOSE') {
            const bPrice = parseFloat(b.price) || 0;
            const bPrepayment = parseFloat(b.prepayment) || 0;
            
            revenue += bPrice;
            
            if (b.isFullyPaid) {
              // Якщо оплачено повністю, передплата не вважається невиплаченим залишком
            } else {
              prepayment += bPrepayment;
              unpaid += Math.max(0, bPrice - bPrepayment);
            }
          }
        });
        return { totalCash: revenue, totalPrepayment: prepayment, outstanding: unpaid };
      }, [bookings]);

      // Генерація фінансового звіту за конкретний обраний місяць
      const monthlyReportData = useMemo(() => {
        const targetYearMonth = `${reportYear}-${reportMonth}`; // Наприклад, '2026-05'
        
        // Доходи за місяць (на основі дати заїзду)
        const monthBookings = bookings.filter(b => {
          if (b.status === 'CANCELLED' || b.status === 'MANUAL_CLOSE') return false;
          return b.checkIn && b.checkIn.startsWith(targetYearMonth);
        });

        const income = monthBookings.reduce((sum, b) => sum + (parseFloat(b.price) || 0), 0);
        
        // Витрати за місяць (на основі дати витрати)
        const monthExpenses = expenses.filter(ex => ex.date && ex.date.startsWith(targetYearMonth));
        const expenseTotal = monthExpenses.reduce((sum, ex) => sum + (parseFloat(ex.amount) || 0), 0);

        return {
          bookingsCount: monthBookings.length,

          expenseTotal,
          profit: income - expenseTotal,
          expensesList: monthExpenses
        };

      }, [remoteChangeAlert]);

      // --- Попередній перегляд тексту повідомлення ---
      const previewMessageText = useMemo(() => {
        const guest = bookings.find(g => g.id === selectedDirectGuestId);
        const template = customTemplates.find(t => t.id === selectedTemplateType);
        if (!template) return 'Оберіть шаблон...';
        if (!guest) return template.text.replace(/{Гість}/g, 'Гість').replace(/{Кімната}/g, 'Кімната').replace(/{Заїзд}/g, 'дд.мм.рррр').replace(/{Виїзд}/g, 'дд.мм.рррр').replace(/{Ціна}/g, '0').replace(/{Передплата}/g, '0');
        const fmt = (d) => { if (!d) return '?'; const parts = d.split('-'); return `${parts[2]}.${parts[1]}.${parts[0]}`; };
        return template.text
          .replace(/{Гість}/g, guest.guestName || '')
          .replace(/{Кімната}/g, guest.roomName || '')
          .replace(/{Заїзд}/g, fmt(guest.checkIn))
          .replace(/{Виїзд}/g, fmt(guest.checkOut))
          .replace(/{Ціна}/g, (guest.price || 0).toLocaleString())
          .replace(/{Передплата}/g, (guest.prepayment || 0).toLocaleString());
      }, [selectedDirectGuestId, selectedTemplateType, customTemplates, bookings]);

        const guest = bookings.find(g => g.id === selectedDirectGuestId);
        const phone = guest?.guestPhone?.replace(/\D/g, '') || '';
        const encodedText = encodeURIComponent(previewMessageText);
        return {
          whatsapp: `https://wa.me/${phone}?text=${encodedText}`,
          telegram: `https://t.me/+${phone}`,
          viber: `viber://chat?number=%2B${phone}&draft=${encodedText}`,
          sms: `sms:+${phone}${/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '&' : '?'}body=${encodedText}`
        };
      }, [selectedDirectGuestId, previewMessageText, bookings]);

      // --- Копіювання в буфер ---
      const handleCopyToClipboard = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(previewMessageText).then(() => showNotificationToast('Текст скопійовано!')).catch(() => {});
        } else {
          const el = document.createElement('textarea');
          el.value = previewMessageText;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          showNotificationToast('Текст скопійовано!');
        }
      };

      // --- Додавання нового шаблону ---
      const handleAddNewTemplate = (e) => {
        e.preventDefault();
        if (!newTemplateLabel.trim() || !newTemplateText.trim()) return;
        const newTemplate = {

                    <form onSubmit={handleAddNewTemplate} className="bg-white p-4 rounded-xl border space-y-3 shadow-sm">
                      <span className="text-[10px] font-bold text-slate-400 uppercase block">Новий шаблон</span>
                      <input type="text" required placeholder="НАЗВА (напр: ПРАВИЛА)" value={newTemplateLabel} onChange={(e) => setNewTemplateLabel(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-xs" />
                      <textarea required placeholder="Текст шаблону. Можна використовувати теги: {Гість}, {Кімната}, {Заїзд}, {Виїзд}, {Ціна}, {Передплата}" rows="5" value={newTemplateText} onChange={(e) => setNewTemplateText(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-lg text-xs" />
                      <button type="submit" className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold">Зберегти новий шаблон</button>
                    </form>
                  </div>
                )}
              </div>
            )}

            {/* Вкладка 5: Ще */}
            {activeTab === 'more' && (
              <div className="space-y-5">
                
                {/* Меню підвкладок вкладки "Ще" */}
                <div className="bg-white rounded-xl border border-slate-150 p-1 flex shadow-sm">
                  <button 
                    onClick={() => setMoreSubTab('rooms')} 
                    className={`flex-1 py-2 text-[11px] font-bold rounded-lg text-center transition ${moreSubTab === 'rooms' ? 'bg-[#4f46e5] text-white' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Номери
                  </button>
                  <button 
                    onClick={() => setMoreSubTab('finance')} 
                    className={`flex-1 py-2 text-[11px] font-bold rounded-lg text-center transition flex items-center justify-center gap-1 ${moreSubTab === 'finance' ? 'bg-[#4f46e5] text-white' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    <WalletIcon /> Фінанси
                  </button>
                  <button 
                    onClick={() => setMoreSubTab('expenses')} 
                    className={`flex-1 py-2 text-[11px] font-bold rounded-lg text-center transition ${moreSubTab === 'expenses' ? 'bg-[#4f46e5] text-white' : 'text-slate-500 hover:text-slate-800'}`}
                  >
                    Витрати
                  </button>
                </div>

                {/* ПІДВКЛАДКА: КЕРУВАННЯ НОМЕРАМИ */}
                {moreSubTab === 'rooms' && (
                  <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                    <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Управління номерами садиби</span>
                    <div className="space-y-2">
                      {rooms.map(rName => (
                        <div key={rName} className="p-3 bg-slate-50 rounded-xl border flex justify-between items-center text-xs">
                          <span className="font-extrabold text-slate-800">{rName}</span>
                          <button onClick={() => handleDeleteRoom(rName)} className="text-rose-600 font-bold hover:text-rose-800">Видалити</button>
                        </div>
                      ))}
                    </div>

                    <div className="flex gap-2">
                      <input type="text" placeholder="Назва котеджу..." value={newRoomName} onChange={(e) => setNewRoomName(e.target.value)} className="flex-1 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none" />
                      <button onClick={handleAddRoom} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold transition hover:bg-black">Додати</button>
                    </div>
                  </div>
                )}

                {/* ПІДВКЛАДКА: ФІНАНСИ */}
                {moreSubTab === 'finance' && (
                  <div className="space-y-4">
                    
                    {/* Базовий фінансовий стан */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">Стан каси</h3>
                      <div className="space-y-3">
                        <div className="flex justify-between items-center py-2 border-b border-slate-100">
                          <span className="text-xs text-slate-500 font-medium">Загальний дохід (Каса):</span>
                          <strong className="text-sm font-extrabold text-slate-900">{stats.totalCash.toLocaleString()} ₴</strong>
                        </div>
                        <div className="flex justify-between items-center py-2 border-b border-slate-100">
                          <span className="text-xs text-slate-500 font-medium">Утримано передплат:</span>
                          <strong className="text-sm font-extrabold text-indigo-700">{stats.totalPrepayment.toLocaleString()} ₴</strong>
                        </div>
                        <div className="flex justify-between items-center py-2">
                          <span className="text-xs text-slate-500 font-medium">Ще не доплатили гості:</span>
                          <strong className="text-sm font-extrabold text-rose-600">{stats.outstanding.toLocaleString()} ₴</strong>
                        </div>
                      </div>
                    </div>

                    {/* Звіт за місяць */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <div className="flex justify-between items-center border-b pb-2">
                        <h3 className="text-xs font-black uppercase tracking-wider text-slate-900">Звіт за місяць</h3>
                        <div className="flex gap-1.5">
                          {/* Селектор Місяця */}
                          <select 
                            value={reportMonth} 
                            onChange={(e) => setReportMonth(e.target.value)}
                            className="bg-slate-100 border-0 text-[10px] font-bold rounded-md py-1 px-1.5 text-slate-700 focus:outline-none focus:ring-0"
                          >
                            {['01','02','03','04','05','06','07','08','09','10','11','12'].map(m => (
                              <option key={m} value={m}>{m}</option>
                            ))}
                          </select>
                          {/* Селектор Року */}
                          <select 
                            value={reportYear} 
                            onChange={(e) => setReportYear(e.target.value)}
                            className="bg-slate-100 border-0 text-[10px] font-bold rounded-md py-1 px-1.5 text-slate-700 focus:outline-none focus:ring-0"
                          >
                            {['2025','2026','2027','2028'].map(y => (
                              <option key={y} value={y}>{y}</option>
                            ))}
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2.5">
                        <div className="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                          <span className="text-[9px] font-bold text-emerald-700 uppercase block">Дохід (Заїзди)</span>
                          <strong className="text-sm font-black text-emerald-800">+{monthlyReportData.income.toLocaleString()} ₴</strong>
                          <span className="text-[8px] text-emerald-600 block mt-0.5">Кількість: {monthlyReportData.bookingsCount}</span>
                        </div>
                        <div className="bg-rose-50 p-3 rounded-xl border border-rose-100">
                          <span className="text-[9px] font-bold text-rose-700 uppercase block">Витрати</span>
                          <strong className="text-sm font-black text-rose-800">-{monthlyReportData.expenseTotal.toLocaleString()} ₴</strong>
                          <span className="text-[8px] text-rose-600 block mt-0.5">Записів: {monthlyReportData.expensesList.length}</span>
                        </div>
                      </div>

                      <div className="bg-indigo-50/50 p-3.5 rounded-xl border border-indigo-100 flex justify-between items-center">
                        <div>
                          <strong className="text-xs text-indigo-900 font-extrabold block">Чистий прибуток</strong>
                          <span className="text-[9px] text-indigo-500">Доходи мінус витрати за обраний місяць</span>
                        </div>
                        <strong className={`text-sm font-black ${monthlyReportData.profit >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>
                          {monthlyReportData.profit.toLocaleString()} ₴
                        </strong>
                      </div>

                      {/* Маленький реєстр витрат у звіті */}
                      {monthlyReportData.expensesList.length > 0 && (
                        <div className="space-y-1.5 pt-2">
                          <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Деталі витрат за місяць:</span>
                          <div className="max-h-36 overflow-y-auto space-y-1 pr-1 font-medium">
                            {monthlyReportData.expensesList.map(ex => (
                              <div key={ex.id} className="text-[10px] bg-slate-50 p-2 rounded-lg border border-slate-100 flex justify-between items-center">
                                <div>
                                  <span className="font-extrabold text-slate-800 block">{ex.description}</span>
                                  <span className="text-[8px] text-slate-400">{ex.date}</span>
                                </div>
                                <span className="text-rose-600 font-bold">-{ex.amount} ₴</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </div>

                  </div>
                )}

                {/* ПІДВКЛАДКА: ВИТРАТИ */}
                {moreSubTab === 'expenses' && (
                  <div className="space-y-4">
                    
                    {/* Форма додавання витрати */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-4">
                      <span className="text-[10px] font-bold text-slate-400 uppercase block tracking-wider">Зафіксувати нову витрату</span>
                      <form onSubmit={handleAddExpense} className="space-y-3">
                        
                        {/* Опис з тегами */}
                        <div>
                          <label className="text-[9px] text-slate-400 font-bold block mb-1">Опис витрати / Категорія</label>
                          <input 
                            type="text" 
                            required 
                            placeholder="Прибирання, комуналка, ремонт..." 
                            value={expenseDesc} 
                            onChange={(e) => setExpenseDesc(e.target.value)} 
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 font-bold" 
                          />
                          
                          {/* Швидкі теги */}
                          <div className="flex flex-wrap gap-1.5 mt-2">
                            {['Комуналка', 'Прибирання', 'Ремонт', 'Закупівля', 'Зарплата', 'Інтернет', 'Прасування'].map(tag => (
                              <button
                                key={tag}
                                type="button"
                                onClick={() => setExpenseDesc(tag)}
                                className="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-[#4f46e5] rounded-md text-[9px] font-bold border border-indigo-100/50 transition"
                              >
                                + {tag}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold block mb-1">Сума (₴)</label>
                            <input 
                              type="number" 
                              required 
                              min="0.1" 
                              step="any" 
                              placeholder="0" 
                              value={expenseAmount} 
                              onChange={(e) => setExpenseAmount(e.target.value)} 
                              className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 font-bold" 
                            />
                          </div>
                          <div>
                            <label className="text-[9px] text-slate-400 font-bold block mb-1">Дата витрати</label>
                            <input 
                              type="date" 
                              required 
                              value={expenseDate} 
                              onChange={(e) => setExpenseDate(e.target.value)} 
                              className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none font-medium" 
                            />
                          </div>
                        </div>

                        <button 
                          type="submit" 
                          className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold transition hover:bg-indigo-700"
                        >
                          Внести витрату
                        </button>
                      </form>
                    </div>

                    {/* Повний список останніх витрат */}
                    <div className="bg-white p-5 rounded-2xl border shadow-sm space-y-3">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Історія витрат ({expenses.length})</span>
                      {expenses.length > 0 ? (
                        <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                          {expenses.slice().sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0)).map(ex => (
                            <div key={ex.id} className="p-3 bg-slate-50 rounded-xl border border-slate-100 flex justify-between items-center text-xs">
                              <div>
                                <strong className="font-extrabold text-slate-800 block">{ex.description}</strong>
                                <span className="text-[9px] text-slate-400 font-semibold">{ex.date}</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <strong className="text-rose-600 font-bold">-{ex.amount} ₴</strong>
                                <button 
                                  onClick={() => handleDeleteExpense(ex.id, ex.description)} 
                                  className="p-1 text-slate-400 hover:text-rose-600 transition"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : (
                        <p className="text-xs text-slate-400 text-center py-6 italic font-medium">Витрати ще не вносились.</p>
                      )}
                    </div>

                  </div>
                )}

              </div>
            )}

          </main>

          {/* Модалка бронювання */}
          {isAddEditModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
              <div className="bg-white rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-xs font-bold uppercase text-slate-700">{editingBooking ? 'Редагувати' : 'Нове бронювання'}</h3>
                  <button onClick={() => setIsAddEditModalOpen(false)}><XIcon /></button>
                </div>
                <form onSubmit={handleSaveBooking} className="space-y-3">
                  <input type="text" placeholder="ПІБ гостя" required value={formData.guestName} onChange={(e) => setFormData(p => ({ ...p, guestName: e.target.value }))} className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold" />
                  <input type="tel" placeholder="Телефон" value={formData.guestPhone} onChange={(e) => setFormData(p => ({ ...p, guestPhone: e.target.value }))} className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                  
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] text-slate-400 font-bold block">Вартість (грн)</label>
                      <input type="number" required placeholder="0" value={formData.price} onChange={(e) => setFormData(p => ({ ...p, price: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs mt-1 font-bold" />
                    </div>
                    <div>
                      <label className="text-[9px] text-slate-400 font-bold block">Передплата (грн)</label>
                      <input type="number" placeholder="0" disabled={formData.isFullyPaid} value={formData.isFullyPaid ? '0' : formData.prepayment} onChange={(e) => setFormData(p => ({ ...p, prepayment: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs mt-1 disabled:opacity-50" />
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3 rounded-xl border flex items-center justify-between">
                    <div>
                      <span className="text-xs font-bold text-slate-800 block">Оплачено повністю</span>
                      <span className="text-[9px] text-slate-400 block">Передплата автоматично стане 0</span>
                    </div>
                    <input 
                      type="checkbox"
                      checked={formData.isFullyPaid}
                      onChange={(e) => {
                        const isChecked = e.target.checked;
                        setFormData(prev => ({ 
                          ...prev, 
                          isFullyPaid: isChecked,
                          prepayment: isChecked ? '0' : prev.prepayment
                        }));
                      }}
                      className="w-5 h-5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="text-[9px] text-slate-400 block mb-1">Кімната / Котедж</label>
                    <select value={formData.roomName} onChange={(e) => setFormData(prev => ({ ...prev, roomName: e.target.value }))} className="w-full px-3 py-2 bg-slate-50 border rounded-xl text-xs font-bold text-slate-700">
                      {rooms.map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[9px] text-slate-400 block mb-1">Дата заїзду</label>
                      <input type="date" required value={formData.checkIn} onChange={(e) => setFormData(p => ({ ...p, checkIn: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs" />
                    </div>
                    <div>
                      <label className="text-[9px] text-slate-400 block mb-1">Дата виїзду</label>
                      <input type="date" required value={formData.checkOut} onChange={(e) => setFormData(p => ({ ...p, checkOut: e.target.value }))} className="w-full p-2 bg-slate-50 border rounded-xl text-xs" />
                    </div>
                  </div>

                  <textarea placeholder="Примітки..." value={formData.notes} onChange={(e) => setFormData(p => ({ ...p, notes: e.target.value }))} rows="2" className="w-full p-3 bg-slate-50 border rounded-xl text-xs" />

                  <button type="submit" disabled={isSaving} className="w-full bg-[#4f46e5] text-white py-3.5 rounded-2xl text-xs font-black uppercase tracking-wider">{isSaving ? 'Збереження...' : 'ЗБЕРЕГТИ'}</button>
                </form>
              </div>
            </div>
          )}

          {/* Кастомне вікно підтвердження */}
          {confirmDialog.isOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-[100] flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-xs w-full border border-slate-100 text-center space-y-4">
                <div className="space-y-1">
                  <h3 className="font-extrabold text-slate-900 text-base">{confirmDialog.title}</h3>
                  <p className="text-xs text-slate-500 leading-relaxed">{confirmDialog.message}</p>
                </div>
                <div className="grid grid-cols-2 gap-2 pt-2">
                  <button onClick={() => setConfirmDialog(p => ({ ...p, isOpen: false }))} className="bg-slate-100 text-slate-700 text-xs py-2.5 rounded-xl font-bold">Скасувати</button>
                  <button onClick={() => { if (confirmDialog.onConfirm) confirmDialog.onConfirm(); setConfirmDialog(p => ({ ...p, isOpen: false })); }} className="bg-rose-600 text-white text-xs py-2.5 rounded-xl font-bold">Підтвердити</button>
                </div>
              </div>
            </div>
          )}

          {/* Модалка імені оператора */}
          {isNamePromptOpen && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-5 shadow-2xl max-w-xs w-full border border-slate-100 space-y-4">
                <div className="text-center space-y-1">
                  <h3 className="font-black text-sm text-slate-900">Вхід у PMS Садиби</h3>
                  <p className="text-[11px] text-slate-400">Вкажіть ваше ім'я або посаду для ведення історії операцій.</p>
                </div>
                <input type="text" placeholder="Приклад: Ірина" value={tempName} onChange={(e) => setTempName(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl text-xs font-bold text-center focus:outline-none" onKeyDown={(e) => e.key === 'Enter' && handleSaveUserName()} />
                <button onClick={handleSaveUserName} disabled={!tempName.trim()} className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold disabled:opacity-50">Увійти в систему</button>
              </div>
            </div>
          )}

          {/* Нижня панель навігації */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-3 flex justify-around items-center z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'home' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><HomeIcon /><span>Головна</span></button>
            <button onClick={() => setActiveTab('bookings')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'bookings' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><ClockIcon /><span>Бронювання</span></button>
            <button onClick={() => setActiveTab('availability')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'availability' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><CalendarIcon /><span>Календар</span></button>
            <button onClick={() => setActiveTab('messages')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'messages' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><MessageSquareIcon /><span>Чати</span></button>
            <button onClick={() => setActiveTab('more')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'more' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><SlidersIcon /><span>Ще</span></button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
