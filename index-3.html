  <script>
    // ===== SERVICE WORKER реєстрація =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Вбудований Service Worker через Blob URL
        const swCode = `
const CACHE = 'kychera-v2';
const OFFLINE_URLS = ['/'];

self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(OFFLINE_URLS)).catch(()=>{}));
  self.skipWaiting();
});

self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
  ));
  self.clients.claim();
});

self.addEventListener('fetch', e => {
  // Тільки GET-запити і не Firebase/CDN
  if (e.request.method !== 'GET') return;
  const url = e.request.url;
  if (url.includes('firestore') || url.includes('googleapis') || url.includes('unpkg') || url.includes('cdn.tailwind')) return;

  e.respondWith(
    fetch(e.request).then(res => {
      if (res && res.status === 200 && res.type === 'basic') {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
      }
      return res;
    }).catch(() => caches.match(e.request))
  );
});

// Push сповіщення
self.addEventListener('push', e => {
  const data = e.data ? e.data.json() : { title: 'Кичера PMS', body: 'Нова подія' };
  e.waitUntil(self.registration.showNotification(data.title, {
    body: data.body,
    icon: 'https://placehold.co/192x192/4f46e5/ffffff?text=КЕ',
    badge: 'https://placehold.co/72x72/4f46e5/ffffff?text=К',
    vibrate: [200, 100, 200],
    data: { url: self.location.origin }
  }));
});

self.addEventListener('notificationclick', e => {
  e.notification.close();
  e.waitUntil(clients.openWindow(e.notification.data.url || '/'));
});
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(console.warn);
      });
    }
  </script>

            snapshot.docChanges().forEach(change => {
              const data = { id: change.doc.id, ...change.doc.data() };
              // Пропускаємо власні зміни та iCal-бронювання
              if (data.updatedBy === userName && change.type !== 'added') return;
              if (data.status === 'ICAL') return;
              const who = data.updatedBy || data.createdBy || 'Інший оператор';
              // Показуємо сповіщення тільки якщо змінив хтось інший

      // ===== РЕАЛЬНА СИНХРОНІЗАЦІЯ iCal =====
      const parseIcsText = (icsText, channel) => {
        const events = [];
        const lines = icsText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        let inEvent = false, current = {};
        lines.forEach(line => {
          if (line === 'BEGIN:VEVENT') { inEvent = true; current = {}; }
          else if (line === 'END:VEVENT' && inEvent) {
            inEvent = false;
            if (current.dtstart && current.dtend) {
              const fmt = (s) => {
                const d = s.replace(/[^0-9]/g, '').substring(0, 8);
                return `${d.substring(0,4)}-${d.substring(4,6)}-${d.substring(6,8)}`;
              };
              events.push({
                guestName: current.summary || `Зайнято (${channel.source})`,
                roomName: channel.roomName,
                checkIn: fmt(current.dtstart),
                checkOut: fmt(current.dtend),
                price: 0, prepayment: 0,
                status: 'ICAL',
                isFullyPaid: true,
                createdBy: `${channel.source} iCal`
              });
            }
          } else if (inEvent) {
            if (line.startsWith('DTSTART')) current.dtstart = line.split(':').pop();
            else if (line.startsWith('DTEND')) current.dtend = line.split(':').pop();
            else if (line.startsWith('SUMMARY')) current.summary = line.split(':').slice(1).join(':');
          }
        });
        return events;
      };

      const handleTriggerSync = async () => {
        setIsSyncingIcal(true);

        if (isOfflineMode) {
          setTimeout(() => {

            setSyncStatus('synced');
            showNotificationToast('⚠️ iCal синхронізація недоступна в офлайн-режимі');
          }, 800);
          return;
        }

        if (!window.firebaseServices || icalChannels.length === 0) {
          setIsSyncingIcal(false);
          setSyncStatus('synced');
          showNotificationToast('Немає підключених каналів iCal');
          return;
        }

        const { db, appId, collection, addDoc, doc, deleteDoc } = window.firebaseServices;

        try {
          // 1. Видаляємо старі iCal бронювання
          const oldIcalBookings = bookings.filter(b => b.status === 'ICAL');
          for (const b of oldIcalBookings) {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bookings', b.id));
          }

          const bookingsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
          let totalImported = 0;
          let failedChannels = 0;

          // 2. Завантажуємо реальні дані з кожного каналу
          for (const channel of icalChannels) {
            try {
              // Пробуємо через proxy (уникає CORS)
              const proxyUrl = `${ICAL_PROXY_URL}?url=${encodeURIComponent(channel.url)}`;
              const res = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const icsText = await res.text();
              const events = parseIcsText(icsText, channel);

              for (const ev of events) {
                await addDoc(bookingsCollection, ev);
                totalImported++;
              }
            } catch (fetchErr) {
              console.warn(`Не вдалось отримати ${channel.source}: ${fetchErr.message}`);
              failedChannels++;
              // Додаємо placeholder щоб показати що канал є
              await addDoc(bookingsCollection, {
                guestName: `⚠️ Потрібен proxy (${channel.source})`,
                roomName: channel.roomName,
                checkIn: new Date().toISOString().split('T')[0],
                checkOut: new Date(Date.now() + 86400000).toISOString().split('T')[0],
                price: 0, prepayment: 0,
                status: 'ICAL',
                isFullyPaid: true,
                createdBy: `${channel.source} iCal`
              });
            }
          }

          await logActivity(`Синхронізація iCal: ${totalImported} подій імпортовано, ${failedChannels} каналів потребують proxy.`);
          
          if (failedChannels > 0) {
            showNotificationToast(`⚠️ ${failedChannels} канал(ів) потребують Cloudflare proxy. Налаштуйте у розділі "Ще".`);
          } else {
            showNotificationToast(`✅ Синхронізовано ${totalImported} подій!`);
          }
        } catch (err) {
          console.error(err);
          showNotificationToast('❌ Помилка синхронізації iCal');
        } finally {
          setIsSyncingIcal(false);
          setSyncStatus('synced');
        }
      };

          if (editingBooking) {
            updated = bookings.map(b => b.id === editingBooking.id ? { ...b, ...payload } : b);
          } else {
            payload.id = 'booking_' + Date.now();
            payload.createdAt = Date.now();
            payload.createdBy = userName || 'Адміністратор';
            updated = [...bookings, payload];
          }
          setBookings(updated);
          localStorage.setItem('kychera_fallback_bookings', JSON.stringify(updated));
          setIsAddEditModalOpen(false);
          setRangeStart(null);
          setRangeEnd(null);
          resetForm();
          showNotificationToast('Бронювання збережено локально!');
          return;
        }

        if (!window.firebaseServices) return;
        const { db, appId, collection, doc, addDoc, updateDoc } = window.firebaseServices;
        setIsSaving(true); 

        try {
          if (editingBooking) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bookings', editingBooking.id);
            await updateDoc(docRef, payload);
            await logActivity(`Змінено бронювання гостя ${formData.guestName}`);
          } else {
            payload.createdAt = Date.now();
            payload.createdBy = userName || 'Адміністратор';
            const bookingsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'bookings');
            await addDoc(bookingsCollection, payload);
            await logActivity(`Додано пряме бронювання для ${formData.guestName}`);
          }
          
          setIsAddEditModalOpen(false);
          setRangeStart(null);
          setRangeEnd(null);
          resetForm();
          showNotificationToast('Бронювання збережено!');
        } catch (err) {
          console.error(err);
        } finally {
          setIsSaving(false);
        }
      };

      const handleDeleteBooking = (e, id, name) => {
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        if (!id) return;

        setConfirmDialog({
          isOpen: true,
          title: 'Видалити замовлення?',
          message: `Ви дійсно хочете назавжди видалити замовлення для ${name || 'цього гостя'}? Цю дію неможливо скасувати.`,
          onConfirm: async () => {
            if (isOfflineMode) {
              const updated = bookings.filter(b => b.id !== id);
              setBookings(updated);
              localStorage.setItem('kychera_fallback_bookings', JSON.stringify(updated));
              showNotificationToast('Бронювання видалено локально!');
              return;
            }

            if (!window.firebaseServices) return;
            const { db, appId, doc, deleteDoc } = window.firebaseServices;
            try {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'bookings', id);
              await deleteDoc(docRef);
              await logActivity(`Видалив бронювання для ${name || 'без імені'}`);
              showNotificationToast('Бронювання успішно видалено!');
            } catch (err) {
              console.error("Помилка видалення: ", err);
            }
          }
        });
      };

      const resetForm = () => {
        setFormData({
          guestName: '',
          guestPhone: '',
          roomName: selectedRoom,
          checkIn: '',
          checkOut: '',
          price: '',
          prepayment: '', 
          status: 'CONFIRMED',
          isFullyPaid: false,
          notes: '',
          adults: 2,
          children: 0
        });
        setEditingBooking(null);
      };

      const openEditModal = (b) => {
        setEditingBooking(b);
        setFormData({
          guestName: b.guestName,
          guestPhone: b.guestPhone || '',
          roomName: b.roomName,
          checkIn: b.checkIn,
          checkOut: b.checkOut,
          price: b.price.toString(),
          prepayment: b.prepayment !== undefined ? b.prepayment.toString() : '',
          status: b.status,
          isFullyPaid: b.isFullyPaid || false,
          notes: b.notes || '',
          adults: b.adults || 2,
          children: b.children || 0
        });
        setIsAddEditModalOpen(true);
      };

      const filteredBookings = useMemo(() => {
        return bookings.filter(b => {
          const term = searchTerm.toLowerCase();
          return (
            b.guestName?.toLowerCase().includes(term) ||
            (b.guestPhone && b.guestPhone.includes(term)) ||
            (b.checkIn && b.checkIn.includes(term)) ||
            b.roomName?.toLowerCase().includes(term)
          );
        }).sort((a, b) => new Date(a.checkIn) - new Date(b.checkIn));
      }, [bookings, searchTerm]);

      const stats = useMemo(() => {
        let revenue = 0, prepayment = 0;
        bookings.forEach(b => {
          if (b.status !== 'CANCELLED' && b.status !== 'MANUAL_CLOSE') {
            revenue += b.price || 0;
            if (!b.isFullyPaid) {
              prepayment += b.prepayment || 0;
            }
          }
        });
        return { totalCash: revenue, totalPrepayment: prepayment };
      }, [bookings]);

      const todayActivities = useMemo(() => {
        const checkIns = bookings.filter(b => b.checkIn === todayStr && b.status !== 'CANCELLED' && b.status !== 'MANUAL_CLOSE');
        const checkOuts = bookings.filter(b => b.checkOut === todayStr && b.status !== 'CANCELLED' && b.status !== 'MANUAL_CLOSE');
        return { checkIns, checkOuts };
      }, [bookings, todayStr]);

      const monthLabel = useMemo(() => {
        return currentDate.toLocaleDateString('uk-UA', { month: 'long', year: 'numeric' });
      }, [currentDate]);

      // --- Список прямих гостей для блоку повідомлень ---
      const directGuests = useMemo(() => {
        return bookings.filter(b => b.status !== 'ICAL' && b.status !== 'MANUAL_CLOSE' && b.status !== 'CANCELLED' && b.guestPhone);
      }, [bookings]);

      // Auto-dismiss remote change alert
      useEffect(() => {
        if (!remoteChangeAlert) return;
        const t = setTimeout(() => setRemoteChangeAlert(null), 5000);
        return () => clearTimeout(t);
      }, [remoteChangeAlert]);

      // --- Попередній перегляд тексту повідомлення ---
      const previewMessageText = useMemo(() => {
        const guest = directGuests.find(g => g.id === selectedDirectGuestId);
        const template = customTemplates.find(t => t.id === selectedTemplateType);
        if (!template) return 'Оберіть шаблон...';
        if (!guest) return template.text.replace(/{Гість}/g, 'Гість').replace(/{Кімната}/g, 'Кімната').replace(/{Заїзд}/g, 'дд.мм.рррр').replace(/{Виїзд}/g, 'дд.мм.рррр').replace(/{Ціна}/g, '0').replace(/{Передплата}/g, '0');
        const fmt = (d) => { if (!d) return '?'; const parts = d.split('-'); return `${parts[2]}.${parts[1]}.${parts[0]}`; };
        return template.text
          .replace(/{Гість}/g, guest.guestName || '')
          .replace(/{Кімната}/g, guest.roomName || '')
          .replace(/{Заїзд}/g, fmt(guest.checkIn))
          .replace(/{Виїзд}/g, fmt(guest.checkOut))
          .replace(/{Ціна}/g, (guest.price || 0).toLocaleString())
          .replace(/{Передплата}/g, (guest.prepayment || 0).toLocaleString());
      }, [selectedDirectGuestId, selectedTemplateType, customTemplates, directGuests]);

      // --- Посилання для месенджерів ---
      const messengerUrls = useMemo(() => {
        const guest = directGuests.find(g => g.id === selectedDirectGuestId);
        const phone = guest?.guestPhone?.replace(/\D/g, '') || '';
        const encodedText = encodeURIComponent(previewMessageText);
        return {
          whatsapp: `https://wa.me/${phone}?text=${encodedText}`,
          telegram: `https://t.me/+${phone}`,
          viber: `viber://chat?number=%2B${phone}&draft=${encodedText}`,
          sms: `sms:+${phone}${/iPhone|iPad|iPod/i.test(navigator.userAgent) ? '&' : '?'}body=${encodedText}`
        };
      }, [selectedDirectGuestId, previewMessageText, directGuests]);

      // --- Копіювання в буфер ---
      const handleCopyToClipboard = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(previewMessageText).then(() => showNotificationToast('Текст скопійовано!')).catch(() => {});
        } else {
          const el = document.createElement('textarea');
          el.value = previewMessageText;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          showNotificationToast('Текст скопійовано!');
        }
      };

      // --- Додавання нового шаблону ---
      const handleAddNewTemplate = (e) => {
        e.preventDefault();
        if (!newTemplateLabel.trim() || !newTemplateText.trim()) return;
        const newTemplate = {
          id: 'custom_' + Date.now(),
          label: newTemplateLabel.trim().toUpperCase(),
          text: newTemplateText.trim()
        };
        setCustomTemplates(prev => [...prev, newTemplate]);
        setNewTemplateLabel('');
        setNewTemplateText('');
        setIsEditingTemplates(false);
        showNotificationToast('Шаблон збережено!');

      return (
        <div className="min-h-screen bg-[#fafbfc] text-slate-800 flex flex-col pb-24 selection:bg-indigo-100">
          
          {/* Toast-сповіщення (власні дії) */}
          {activeBanner && (
            <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[200] bg-slate-900 text-white text-xs font-bold px-5 py-3 rounded-2xl shadow-xl toast-animate max-w-[90vw] text-center pointer-events-none">
              {activeBanner}
            </div>

          {/* Сповіщення від ІНШИХ операторів (real-time) */}

              <span className="w-2 h-2 bg-white rounded-full pulse-dot shrink-0"></span>

          </header>

              <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Загальна каса</span>
              <strong className="text-base font-black text-slate-900">{stats.totalCash.toLocaleString()} ₴</strong>

            <div className="bg-slate-50/50 p-3 rounded-xl border border-slate-100">
              <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Передплати (в утриманні)</span>
              <strong className="text-base font-black text-indigo-700">{stats.totalPrepayment.toLocaleString()} ₴</strong>
            </div>
          </div>

          <main className="flex-1 max-w-md mx-auto w-full px-4 py-4 space-y-6">

            {/* Вкладка 1: Головна */}
            {activeTab === 'home' && (
              <div className="space-y-4">
                
                {/* Заїзди сьогодні */}
                <div className="bg-white p-4 rounded-xl border border-slate-150 shadow-sm space-y-3">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="text-xs font-bold uppercase text-emerald-700 flex items-center gap-1.5">
                      <ArrowDownCircleIcon /> 📥 Заїзди сьогодні ({todayActivities.checkIns.length})
                    </h3>
                    <span className="text-[10px] text-slate-400 font-bold">{formatFriendlyDate(todayStr)}</span>
                  </div>
                  <div className="space-y-3">
                    {todayActivities.checkIns.length > 0 ? (
                      todayActivities.checkIns.map(b => {
                        const balance = b.isFullyPaid ? 0 : Math.max(0, (b.price || 0) - (b.prepayment || 0));
                        return (
                          <div key={b.id} className="p-3 bg-emerald-50/40 rounded-xl border border-emerald-100/70 space-y-1">
                            <div className="flex justify-between items-start">
                              <div>
                                <strong className="text-xs text-slate-900 font-extrabold">{b.guestName}</strong>
                                <p className="text-[10px] text-slate-500">{b.guestPhone || 'без номера'}</p>
                              </div>
                              <span className="bg-[#4f46e5] text-white text-[9px] font-bold px-2 py-0.5 rounded">{b.roomName}</span>
                            </div>
                            <div className="flex justify-between text-[11px] pt-1 text-slate-700">
                              <span>Залишок до сплати:</span>
                              <span className={balance === 0 ? 'text-emerald-600 font-bold' : 'text-rose-600 font-black'}>
                                {balance === 0 ? 'Все сплачено!' : `${balance.toLocaleString()} ₴`}
                              </span>
                            </div>
                          </div>
                        );
                      })
                    ) : (
                      <p className="text-xs text-slate-400 py-3 text-center italic font-medium">Сьогодні немає заїздів.</p>
                    )}
                  </div>
                </div>

                {/* Виїзди сьогодні */}
                <div className="bg-white p-4 rounded-xl border border-slate-150 shadow-sm space-y-3">
                  <div className="flex items-center justify-between border-b pb-2">
                    <h3 className="text-xs font-bold uppercase text-rose-700 flex items-center gap-1.5">
                      <ArrowUpCircleIcon /> 📤 Виїзди сьогодні ({todayActivities.checkOuts.length})
                    </h3>
                    <span className="text-[10px] text-slate-400 font-bold">{formatFriendlyDate(todayStr)}</span>
                  </div>
                  <div className="space-y-3">
                    {todayActivities.checkOuts.length > 0 ? (
                      todayActivities.checkOuts.map(b => (

                          <div className="flex justify-between items-start">
                            <div>
                              <strong className="text-xs text-slate-900 font-extrabold">{b.guestName}</strong>
                              <p className="text-[10px] text-slate-500">{b.guestPhone || 'без номера'}</p>
                            </div>
                            <span className="bg-slate-700 text-white text-[9px] font-bold px-2 py-0.5 rounded">{b.roomName}</span>
                          </div>
                        </div>

                      <p className="text-xs text-slate-400 py-3 text-center italic font-medium">Сьогодні немає виїздів.</p>

                  </div>
                </div>

                {/* Швидка синхронізація */}
                <div className="bg-white p-4 rounded-xl border border-slate-150 shadow-sm space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h4 className="text-xs font-black uppercase text-slate-900">Синхронізація каналів</h4>

                    >
                      <RefreshIcon /> Sync (iCal)
                    </button>
                  </div>
                </div>

              </div>
            )}

            {/* Вкладка 2: Бронювання */}
            {activeTab === 'bookings' && (
              <div className="space-y-4">
                <div className="relative">
                  <SearchIcon />
                  <input 
                    type="text" 
                    placeholder="Шукати за ім'ям, телефоном або котеджем..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full pl-9 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium"
                  />
                </div>

                <div className="space-y-3">
                  {filteredBookings.length > 0 ? (
                    filteredBookings.map(b => {
                      const balance = b.isFullyPaid ? 0 : Math.max(0, (b.price || 0) - (b.prepayment || 0));
                      return (
                        <div key={b.id} className="bg-white p-4 rounded-xl border border-slate-150 shadow-sm space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="bg-indigo-50 text-indigo-800 text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wider block w-max mb-1">{b.roomName}</span>
                              <h4 className="font-extrabold text-sm text-slate-900">{b.guestName}</h4>
                              <p className="text-xs text-slate-500 mt-0.5">{b.guestPhone || 'Телефон не вказано'}</p>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                              <span className={`px-2 py-0.5 text-[9px] font-extrabold border rounded-full ${
                                b.status === 'ICAL' ? 'bg-amber-50 text-amber-700 border-amber-200' : 
                                b.status === 'MANUAL_CLOSE' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-blue-50 text-blue-700 border-blue-200'
                              }`}>{b.status === 'ICAL' ? 'iCal синхро' : b.status === 'MANUAL_CLOSE' ? 'Тех. закриття' : 'Пряма бронь'}</span>

                              {b.status !== 'ICAL' && b.status !== 'MANUAL_CLOSE' && (
                                b.isFullyPaid ? (
                                  <span className="bg-emerald-100 text-emerald-800 text-[9px] font-black px-2 py-0.5 rounded-full border border-emerald-200">💵 Оплачено 100%</span>
                                ) : (
                                  <span className="bg-rose-50 text-rose-700 text-[9px] font-black px-2 py-0.5 rounded-full border border-rose-200">⏳ Очікує залишку</span>
                                )
                              )}
                            </div>
                          </div>

                          <div className="text-xs text-slate-700 space-y-1 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <div className="flex justify-between">
                              <span>Термін проживання:</span>
                              <strong className="font-extrabold text-[#4f46e5]">{b.checkIn} — {b.checkOut}</strong>
                            </div>
                            {b.status !== 'ICAL' && b.status !== 'MANUAL_CLOSE' && (
                              <>
                                <div className="flex justify-between text-slate-600">
                                  <span>Вартість:</span>
                                  <span>{b.price} ₴</span>
                                </div>
                                {!b.isFullyPaid && b.prepayment > 0 && (
                                  <div className="flex justify-between text-slate-600">
                                    <span>Внесено передоплати:</span>
                                    <span>{b.prepayment} ₴</span>
                                  </div>
                                )}
                                <div className="flex justify-between text-xs pt-1 border-t border-slate-200 font-extrabold text-slate-900">
                                  <span>Залишок:</span>
                                  <span className={b.isFullyPaid ? 'text-emerald-600 font-bold' : 'text-rose-600'}>
                                    {b.isFullyPaid ? '0 ₴ (Все оплачено)' : `${balance} ₴`}
                                  </span>
                                </div>
                              </>
                            )}
                          </div>

                          <div className="flex justify-between items-center border-t border-slate-100 pt-2.5">
                            <span className="text-[10px] text-slate-400">Створив: <strong>{b.createdBy || 'Адмін'}</strong></span>
                            <div className="flex items-center space-x-2">
                              {b.status !== 'ICAL' && b.status !== 'MANUAL_CLOSE' && (
                                <button
                                  onClick={() => handleToggleFullyPaid(b)}
                                  className={`p-1.5 rounded-lg border text-xs font-bold flex items-center gap-1 transition ${
                                    b.isFullyPaid 
                                      ? 'bg-slate-100 text-slate-500 border-slate-200 hover:bg-slate-200' 
                                      : 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100'
                                  }`}
                                >
                                  <CheckIcon /> {b.isFullyPaid ? 'Скасувати' : 'Повна оплата'}
                                </button>
                              )}
                              {b.status !== 'ICAL' && (
                                <div className="flex items-center space-x-1">
                                  <button onClick={() => openEditModal(b)} className="p-1.5 text-blue-600 bg-slate-50 rounded-md border border-slate-200"><EditIcon /></button>
                                  <button onClick={(e) => handleDeleteBooking(e, b.id, b.guestName)} className="p-1.5 text-rose-600 bg-rose-50 rounded-md border border-rose-200"><TrashIcon /></button>
                                </div>
                              )}
                            </div>
                          </div>
                        </div>

                  ) : (

                  )}
                </div>
              </div>
            )}

            {/* Вкладка 3: Календар */}
            {activeTab === 'availability' && (
              <div className="space-y-4">
                <div className="text-center space-y-1">

                  <div className="flex items-center justify-between max-w-[280px] mx-auto pt-2 text-[#4f46e5]">

                </div>
                <input type="text" placeholder="Приклад: Ірина" value={tempName} onChange={(e) => setTempName(e.target.value)} className="w-full px-3 py-2.5 border rounded-xl text-xs font-bold text-center focus:outline-none" onKeyDown={(e) => e.key === 'Enter' && handleSaveUserName()} />
                <button onClick={handleSaveUserName} disabled={!tempName.trim()} className="w-full bg-[#4f46e5] text-white py-2.5 rounded-xl text-xs font-bold disabled:opacity-50">Увійти в систему</button>
              </div>
            </div>
          )}

          {/* Нижня панель навігації */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2.5 px-3 flex justify-around items-center z-40 shadow-[0_-2px_10px_rgba(0,0,0,0.03)]">
            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'home' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><HomeIcon /><span>Головна</span></button>
            <button onClick={() => setActiveTab('bookings')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'bookings' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><ClockIcon /><span>Бронювання</span></button>
            <button onClick={() => setActiveTab('availability')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'availability' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><CalendarIcon /><span>Календар</span></button>
            <button onClick={() => setActiveTab('messages')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'messages' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><MessageSquareIcon /><span>Чати</span></button>
            <button onClick={() => setActiveTab('more')} className={`flex flex-col items-center gap-1 text-[9px] font-black ${activeTab === 'more' ? 'text-[#4f46e5]' : 'text-slate-400'}`}><SlidersIcon /><span>Ще</span></button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
